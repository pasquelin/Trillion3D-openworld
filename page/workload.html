<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open World — street block workloads</title>
    <style>
      body { margin: 0; background: #16212c; color: #fff; font: 16px system-ui; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; }
      aside { position: fixed; z-index: 1; top: 12px; left: 12px; background: #16212ce6; padding: 16px; max-width: 420px; }
      a { color: #a9dcff; } button, select { margin: 4px; padding: 8px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside>
      <strong>Street block workloads</strong>
      <p>Original detailed facades and two licensed CC0 buildings. Same quality in every workload.</p>
      <label>Blocks <select id="preset"><option value="one-block">1</option><option value="four-blocks">4</option><option value="sixteen-blocks">16</option></select></label>
      <label>Graphics <select id="graphics"><option value="auto">Automatic</option><option value="webgl2">Compatible (WebGL2)</option><option value="webgpu">WebGPU</option></select></label>
      <button id="facade">Facade</button><button id="skyline">Skyline</button>
      <button id="retry">Retry</button>
      <p id="status">Loading…</p>
      <a href="./">Return to the island</a>
    </aside>
    <script type="module">
      import { createWorld, light, math } from './runtime/engine.js';
      const allowed = ['one-block', 'four-blocks', 'sixteen-blocks'];
      const requested = new URL(location.href).searchParams.get('preset');
      const preset = allowed.includes(requested) ? requested : allowed[0];
      const select = document.getElementById('preset'), graphics = document.getElementById('graphics'),
        status = document.getElementById('status');
      const renderer = new URL(location.href).searchParams.get('renderer');
      graphics.value = ['webgpu', 'webgl2'].includes(renderer) ? renderer : 'auto';
      select.value = preset;
      select.onchange = () => {
        const url = new URL(location.href);
        url.searchParams.set('preset', select.value);
        location.href = url.href;
      };
      graphics.onchange = () => {
        const url = new URL(location.href);
        if (graphics.value === 'auto') url.searchParams.delete('renderer');
        else url.searchParams.set('renderer', graphics.value);
        location.href = url.href;
      };
      document.getElementById('retry').onclick = () => location.reload();
      const settle = async (promise, step) => {
        let timer;
        try {
          return await Promise.race([promise, new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error(`${step} did not finish within 60 seconds. Choose Compatible graphics and retry.`)), 60_000);
          })]);
        } finally { clearTimeout(timer); }
      };
      try {
        const base = `./workloads/${preset}/`;
        const response = await fetch(`${base}report.json`);
        if (!response.ok) throw new Error(`This workload has not been cooked. Run pnpm workload ${preset}.`);
        const report = await response.json();
        const world = createWorld('view', ['webgpu', 'webgl2'].includes(renderer) ? { renderer } : {});
        world.budget.geometryPool = report.geometryPoolBytes;
        world.budget.texturePool = report.texturePoolBytes;
        world.controls.kind = 'none';
        const sun = light.directional(report.lighting.sun);
        const fill = light.hemisphere(report.lighting.fill);
        world.scene.add(sun, sun.target, fill);
        world.scene.background = math.color(report.lighting.background);
        const pose = (name) => {
          const camera = report.cameras[name];
          world.camera.position.set(...camera.position);
          world.camera.lookAt(math.vector3(...camera.target));
        };
        // The harness can diagnose engine preparation even before loading settles.
        const session = window.workload = { world, report, pose, ready: false, stage: 'scene' };
        for (const name of ['facade', 'skyline']) document.getElementById(name).onclick = () => pose(name);
        pose('skyline');
        status.textContent = 'Reading the street block scene…';
        await settle(world.scene.load(`${base}cache/native/full/manifest.json`), 'Scene loading');
        pose('skyline');
        session.stage = 'pages';
        status.textContent = 'Streaming the visible geometry…';
        await settle(world.awaitPages(), 'Geometry streaming');
        session.ready = true; session.stage = 'ready';
        status.textContent = `${report.buildingInstances} buildings · ${report.instanceExpandedTriangles.toLocaleString()} authored triangles across instances. Rendering performance is unmeasured.`;
        // Available to the dedicated measurement harness, without a second engine instance.
      } catch (error) {
        status.textContent = error.message;
        if (window.workload) {
          window.workload.stage = 'failed'; window.workload.error = error.message;
          await window.workload.world.dispose();
        }
        console.error(error);
      }
    </script>
  </body>
</html>
